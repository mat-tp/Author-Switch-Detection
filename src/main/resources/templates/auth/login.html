<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log In')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>
<main>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand"><span class="brand-icon">◈</span> Author Switch Detector</div>
            <h2 class="auth-title">Welcome back</h2>

            <div class="alert alert-success" th:if="${param.registered != null}">Account created — log in below.</div>
            <div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>

            <form method="post" th:action="@{/auth/login}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" autofocus
                           th:value="${username}" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Log in</button>
            </form>

            <p class="auth-alt">No account yet? <a th:href="@{/auth/register}">Register</a></p>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
