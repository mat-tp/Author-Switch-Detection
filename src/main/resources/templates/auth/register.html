<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Register')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>
<main>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand"><span class="brand-icon">◈</span> Author Switch Detector</div>
            <h2 class="auth-title">Create your account</h2>

            <div class="alert alert-warning" th:if="${error}" th:text="${error}"></div>

            <form method="post" th:action="@{/auth/register}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" autocomplete="username" autofocus
                           th:value="${username}" minlength="3" maxlength="32" required>
                    <span class="hint">3 to 32 characters: letters, digits, hyphens, or underscores.</span>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" autocomplete="new-password" minlength="6" required>
                    <span class="hint">At least 6 characters.</span>
                </div>
                <div class="form-group">
                    <label for="password2">Confirm password</label>
                    <input type="password" id="password2" name="password2" autocomplete="new-password" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Create account</button>
            </form>

            <p class="auth-alt">Already have an account? <a th:href="@{/auth/login}">Log in</a></p>
        </div>
    </div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
