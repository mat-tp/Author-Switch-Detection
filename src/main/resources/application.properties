spring.application.name=Author-Switch-Detection

# --- Thymeleaf ---
spring.thymeleaf.cache=false

# --- File upload (Inspect / Predict pages accept .txt / .pdf) ---
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=64MB

# --- No database. Users live in a plain JSON-lines file, model metrics too ---
app.users.file=data/users.json
app.model-metrics.file=data/model-metrics.json

# --- Default admin account, created on first boot if it doesn't exist ---
app.admin.username=admin
app.admin.password=admin123

# --- Where a freshly trained model (from the Train page) is saved to disk.
# Checked before the bundled baseline model on every prediction. ---
app.trained-models.dir=data/models

# --- Where the training dataset (MAWSA-style corpus) lives on disk ---
app.dataset.root=dataset/mawsa26-pan-zenodo-DATA/
